<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="El Romeo, Barbershop Zürich">
  <defs>
    <!-- top arc runs clockwise over the top; bottom arc runs under the bottom, so both read left to right -->
    <path id="arc-top" d="M 24 80 A 56 56 0 0 1 136 80"/>
    <path id="arc-bottom" d="M 15 80 A 65 65 0 0 0 145 80"/>
  </defs>

  <!-- rings -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="#fafafa" stroke-width="1.6"/>
  <circle cx="80" cy="80" r="71" fill="none" stroke="#52525b" stroke-width="0.8"/>

  <!-- curved lettering -->
  <text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.2" fill="#fafafa">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">BARBERSHOP</textPath>
  </text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="4" fill="#a1a1aa">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">ZÜRICH</textPath>
  </text>

  <!-- side stars between the two arcs -->
  <path d="M 21 76.6 L 22 79 L 24.4 80 L 22 81 L 21 83.4 L 20 81 L 17.6 80 L 20 79 Z" fill="#fafafa"/>
  <path d="M 139 76.6 L 140 79 L 142.4 80 L 140 81 L 139 83.4 L 138 81 L 135.6 80 L 138 79 Z" fill="#fafafa"/>

  <!-- scissors -->
  <g transform="translate(80 47)" fill="none" stroke="#fafafa" stroke-width="1.2" stroke-linecap="round">
    <circle cx="-4.2" cy="6.2" r="2.4"/>
    <circle cx="4.2" cy="6.2" r="2.4"/>
    <path d="M -2.6 4.4 L 5.6 -7.5 M 2.6 4.4 L -5.6 -7.5"/>
  </g>

  <!-- name -->
  <text x="80" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" letter-spacing="2" fill="#d4d4d8">El</text>
  <text x="80" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" letter-spacing="1" fill="#fafafa">ROMEO</text>

  <!-- rule + line under the name -->
  <path d="M 40 102.5 H 120" stroke="#fafafa" stroke-width="0.8"/>
  <circle cx="40" cy="102.5" r="1.2" fill="#fafafa"/>
  <circle cx="120" cy="102.5" r="1.2" fill="#fafafa"/>
  <text x="80" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.6" font-weight="600" letter-spacing="2.8" fill="#d4d4d8">HERREN &amp; DAMEN</text>
</svg>
