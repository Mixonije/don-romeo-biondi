<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Don Romeo Brioni, Barbershop Zürich">
  <defs>
    <!-- top arc runs clockwise over the top; bottom arc runs under the bottom, so both read left to right -->
    <path id="arc-top" d="M 24 80 A 56 56 0 0 1 136 80"/>
    <path id="arc-bottom" d="M 15 80 A 65 65 0 0 0 145 80"/>
  </defs>

  <!-- rings -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="#fafafa" stroke-width="1.6"/>
  <circle cx="80" cy="80" r="71" fill="none" stroke="#52525b" stroke-width="0.8"/>

  <!-- curved lettering -->
  <text font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.2" fill="#fafafa">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">BARBERSHOP</textPath>
  </text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="6.6" font-weight="600" letter-spacing="1.9" fill="#a1a1aa">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">ZÜRICH · EST. 2023</textPath>
  </text>

  <!-- side dots between the two arcs -->
  <circle cx="21" cy="80" r="1.6" fill="#fafafa"/>
  <circle cx="139" cy="80" r="1.6" fill="#fafafa"/>

  <!-- scissors -->
  <g transform="translate(80 49)" fill="none" stroke="#fafafa" stroke-width="1.2" stroke-linecap="round">
    <circle cx="-4.2" cy="6.2" r="2.4"/>
    <circle cx="4.2" cy="6.2" r="2.4"/>
    <path d="M -2.6 4.4 L 5.6 -7.5 M 2.6 4.4 L -5.6 -7.5"/>
  </g>

  <!-- name -->
  <text x="80" y="70.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.6" font-weight="600" letter-spacing="3.2" fill="#d4d4d8">DON ROMEO</text>
  <text x="80" y="95" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="1.5" fill="#fafafa">BRIONI</text>

  <!-- rule + tagline -->
  <path d="M 40 101.5 H 120" stroke="#fafafa" stroke-width="0.8"/>
  <circle cx="40" cy="101.5" r="1.2" fill="#fafafa"/>
  <circle cx="120" cy="101.5" r="1.2" fill="#fafafa"/>
  <text x="80" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.8" font-weight="600" letter-spacing="2.8" fill="#d4d4d8">CUTS &amp; SHAVES</text>
</svg>
